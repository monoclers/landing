<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monoclers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #090909;
      background-image:
        radial-gradient(circle at center, rgba(0, 0, 0, 0.02) 20%, rgba(0, 0, 0, 0.42) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.08) 40%, rgba(0, 0, 0, 0.5) 100%),
        url("./wallpaper-clean.webp");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 20px;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .brand-index {
      position: absolute;
      top: 30px;
      right: 40px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      user-select: none;
    }

    .brand-index__parent {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.8;
      transition: opacity 0.3s ease;
      mix-blend-mode: screen;
    }

    .brand-index__parent:hover {
      opacity: 1;
    }

    .brand-index__children {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      margin-top: 13px;
      padding-top: 18px;
      padding-right: 1px;
    }

    .brand-index__children::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0.55em;
      right: 1px;
      width: 1px;
      background: rgba(255, 255, 255, 0.28);
    }

    .brand-index__children a {
      position: relative;
      padding-right: 18px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.24em;
      text-decoration: none;
      opacity: 0.48;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .brand-index__children a::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 0;
      width: 10px;
      height: 1px;
      background: rgba(255, 255, 255, 0.35);
    }

    .brand-index__children a:hover {
      opacity: 1;
      transform: translateX(-2px);
    }

    .container {
      text-align: center;
      max-width: 800px;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: clamp(24px, 7vh, 72px);
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.55);
      animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .center-image {
      position: fixed;
      top: 43.5%;
      left: 50%;
      width: clamp(54px, 6vw, 76px);
      aspect-ratio: 1;
      z-index: 2;
      transform: translate(-50%, -50%);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.6s ease;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.18));
    }

    .center-image:hover {
      transform: translate(-50%, -50%) scale(1.08);
      filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.32));
    }

    .email {
      font-size: 0.9em;
      letter-spacing: 0.15em;
      font-weight: 500;
    }

    .email a {
      text-decoration: none;
      transition: color 0.3s ease, opacity 0.3s ease;
      opacity: 0.8;
    }

    .email a:hover {
      opacity: 1;
      color: #ffffff;
    }

    .copyright {
      margin-top: 60px;
      font-size: 0.75em;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 300;
    }

    /* responsive */
    @media screen and (max-width: 768px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }

      .brand-index {
        top: 10px;
        right: 10px;
      }

      .brand-index__parent {
        font-size: 12px;
        letter-spacing: 0.22em;
      }

      .brand-index__children a {
        font-size: 10px;
      }

      .center-image {
        width: clamp(50px, 14vw, 68px);
      }

      .email {
        font-size: 0.9em;
      }

      .copyright {
        margin-top: 40px;
        font-size: 0.8em;
      }
    }

    @media screen and (max-width: 480px) {
      body {
        padding: 15px;
      }

      .brand-index {
        top: 10px;
        right: 10px;
      }

      .brand-index__parent {
        font-size: 12px;
        letter-spacing: 0.2em;
      }

      .center-image {
        width: clamp(48px, 16vw, 62px);
      }

      .email {
        font-size: 0.85em;
      }

      .copyright {
        margin-top: 30px;
        font-size: 0.75em;
      }
    }

    a:link {
      color: #fff;
    }

    a:visited {
      color: #fff;
    }

    /* === Animated center logo (SVG) — only affects center logo === */
    #centerLogo {
      display: grid;
      place-items: center;
    }

    #centerLogo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    #centerLogo .mc-stroke {
      fill: none;
      stroke: #ffffff;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #centerLogo .mc-fill {
      fill: #ffffff;
    }

    #centerLogo .mc-draw {
      stroke-dasharray: var(--len, 1);
      stroke-dashoffset: var(--len, 1);
      animation: mcDraw 1.15s ease forwards;
    }

    @keyframes mcDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    #centerLogo .mc-float {
      transform-origin: 50% 50%;
      animation: mcFloat 5.2s ease-in-out infinite;
    }

    @keyframes mcFloat {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    #centerLogo .mc-monocle {
      transform-origin: 176px 118px;
      animation: mcWobble 3.6s ease-in-out infinite;
    }

    @keyframes mcWobble {

      0%,
      100% {
        transform: rotate(0deg);
      }

      40% {
        transform: rotate(-2.5deg);
      }

      70% {
        transform: rotate(2deg);
      }
    }

    #centerLogo .mc-blink {
      transform-origin: center;
      animation: mcBlink 5.5s infinite;
    }

    @keyframes mcBlink {

      0%,
      92%,
      100% {
        transform: scaleY(1);
      }

      94% {
        transform: scaleY(0.08);
      }

      96% {
        transform: scaleY(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #centerLogo .mc-draw,
      #centerLogo .mc-float,
      #centerLogo .mc-monocle,
      #centerLogo .mc-blink {
        animation: none !important;
      }

      #centerLogo .mc-draw {
        stroke-dasharray: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>
  <nav class="brand-index" aria-label="Monoclers studios">
    <div class="brand-index__parent">MONOCLERS</div>
    <div class="brand-index__children">
      <a href="https://runchr.com" target="_blank" rel="noopener noreferrer">RUNCHR</a>
      <a href="https://oohaha.com" target="_blank" rel="noopener noreferrer">OOHAHA</a>
      <a href="https://artwoc.com" target="_blank" rel="noopener noreferrer">ARTWOC</a>
    </div>
  </nav>

  <div id="centerLogo" class="center-image" aria-label="logo"></div>

  <div class="container">
    <div class="email">
      <a href="mailto:hello@monoclers.com">HELLO@MONOCLERS.COM</a>
    </div>

    <div class="copyright">
      COPYRIGHT ⓒ MONOCLERS ALL RIGHTS RESERVED.
    </div>
  </div>

  <script>
    (function mountCenterAnimatedLogo() {
      const host = document.getElementById("centerLogo");
      if (!host) return;

      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 256 256");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "monoclers logo");
      svg.setAttribute("class", "mc-float");

      const g = document.createElementNS(ns, "g");

      const face = document.createElementNS(ns, "circle");
      face.setAttribute("cx", "128");
      face.setAttribute("cy", "128");
      face.setAttribute("r", "108");
      face.setAttribute("class", "mc-stroke mc-draw");
      face.setAttribute("stroke-width", "14");
      face.setAttribute("stroke-dasharray", "640 80");
      face.setAttribute("stroke-dashoffset", "40");
      g.appendChild(face);

      // ✅ eyes: SAME SIZE (both circles r=16), SAME HEIGHT (eyeY)
      const eyeY = 118;
      const eyeR = 16;

      const leftEye = document.createElementNS(ns, "circle");
      leftEye.setAttribute("cx", "84");
      leftEye.setAttribute("cy", String(eyeY));
      leftEye.setAttribute("r", String(eyeR));
      leftEye.setAttribute("class", "mc-fill mc-blink");
      g.appendChild(leftEye);

      const smile = document.createElementNS(ns, "path");
      smile.setAttribute("d", "M 102 170 Q 128 194 154 170");
      smile.setAttribute("class", "mc-stroke mc-draw");
      smile.setAttribute("stroke-width", "14");
      g.appendChild(smile);

      const mg = document.createElementNS(ns, "g");
      mg.setAttribute("class", "mc-monocle");

      const ring = document.createElementNS(ns, "circle");
      ring.setAttribute("cx", "176");
      ring.setAttribute("cy", String(eyeY));
      ring.setAttribute("r", "46");
      ring.setAttribute("class", "mc-stroke mc-draw");
      ring.setAttribute("stroke-width", "14");
      mg.appendChild(ring);

      const rightEye = document.createElementNS(ns, "circle");
      rightEye.setAttribute("cx", "176");
      rightEye.setAttribute("cy", String(eyeY));
      rightEye.setAttribute("r", String(eyeR));
      rightEye.setAttribute("class", "mc-fill");
      mg.appendChild(rightEye);

      const handle = document.createElementNS(ns, "path");
      handle.setAttribute("d", "M 206 150 L 228 172");
      handle.setAttribute("class", "mc-stroke mc-draw");
      handle.setAttribute("stroke-width", "14");
      mg.appendChild(handle);

      const dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", "236");
      dot.setAttribute("cy", "180");
      dot.setAttribute("r", "10");
      dot.setAttribute("class", "mc-fill");
      mg.appendChild(dot);

      g.appendChild(mg);
      svg.appendChild(g);

      host.innerHTML = "";
      host.appendChild(svg);

      const drawEls = svg.querySelectorAll(".mc-draw");
      drawEls.forEach((el, i) => {
        try {
          const len = el.getTotalLength();
          el.style.setProperty("--len", Math.ceil(len));
          el.style.animationDelay = (0.08 * i) + "s";
        } catch (e) { }
      });
    })();
  </script>
</body>

</html>
