<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monoclers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .top-right-image {
            position: absolute;
            top: 30px;
            right: 40px;
            max-width: 120px;
            width: 18vw;
            height: auto;
            z-index: 10;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            mix-blend-mode: screen;
        }

        .top-right-image:hover {
            opacity: 1;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .center-image {
            margin: 20px auto;
            width: 400px;
            max-width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.6s ease;
            mix-blend-mode: screen;
            filter: contrast(500%) brightness(0.7);
        }

        .center-image:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.15));
        }

        h1 {
            font-size: 2.5em;
            font-weight: normal;
            margin-bottom: 40px;
            letter-spacing: 0.05em;
        }

        .separator {
            margin: 20px 0;
            font-size: 1.2em;
        }

        .content {
            line-height: 1.8;
            font-size: 1em;
            margin: 20px 0;
        }

        .address {
            margin-top: 20px;
            font-size: 0.9em;
            letter-spacing: 0.2em;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
        }

        .email {
            font-size: 0.9em;
            letter-spacing: 0.15em;
            font-weight: 500;
        }

        .email a {
            text-decoration: none;
            transition: color 0.3s ease, opacity 0.3s ease;
            opacity: 0.8;
        }

        .email a:hover {
            opacity: 1;
            color: #ffffff;
        }

        .copyright {
            margin-top: 60px;
            font-size: 0.75em;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
        }

        /* 반응형 디자인 */
        @media screen and (max-width: 768px) {
            .top-right-image {
                max-width: 80px;
                width: 20vw;
                top: 10px;
                right: 10px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 30px;
            }

            .separator {
                margin: 15px 0;
                font-size: 1em;
            }

            .center-image {
                margin: 30px auto;
                width: 100%;
                max-width: 400px;
            }

            .content {
                font-size: 0.9em;
            }

            .address,
            .email {
                font-size: 0.9em;
            }

            .copyright {
                margin-top: 40px;
                font-size: 0.8em;
            }
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 15px;
            }

            .top-right-image {
                max-width: 80px;
                width: 25vw;
                top: 10px;
                right: 10px;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 20px;
            }

            .separator {
                margin: 10px 0;
            }

            .center-image {
                margin: 20px auto;
                width: 100%;
                max-width: 500px;
            }

            .content {
                font-size: 0.85em;
            }

            .address,
            .phone {
                font-size: 0.85em;
            }

            .copyright {
                margin-top: 30px;
                font-size: 0.75em;
            }
        }

        a:link {
            color: #fff;
        }

        a:visited {
            color: #fff;
        }

        /* === Animated center logo (SVG) — only affects #centerLogo === */
#centerLogo{
  display: grid;
  place-items: center;
}

/* SVG size follows existing .center-image width */
#centerLogo svg{
  width: 100%;
  height: auto;
  display: block;
}

/* White strokes/fills */
#centerLogo .mc-stroke{
  fill: none;
  stroke: #ffffff;
  stroke-width: 14;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#centerLogo .mc-fill{ fill:#ffffff; }

/* Draw-in */
#centerLogo .mc-draw{
  stroke-dasharray: var(--len, 1);
  stroke-dashoffset: var(--len, 1);
  animation: mcDraw 1.15s ease forwards;
}
@keyframes mcDraw { to { stroke-dashoffset: 0; } }

/* Subtle float */
#centerLogo .mc-float{
  transform-origin: 50% 50%;
  animation: mcFloat 5.2s ease-in-out infinite;
}
@keyframes mcFloat{
  0%,100%{ transform: translateY(0px); }
  50%{ transform: translateY(-6px); }
}

/* Monocle wobble */
#centerLogo .mc-monocle{
  transform-origin: 176px 132px;
  animation: mcWobble 3.6s ease-in-out infinite;
}
@keyframes mcWobble{
  0%,100%{ transform: rotate(0deg); }
  40%{ transform: rotate(-2.5deg); }
  70%{ transform: rotate(2deg); }
}

/* Blink */
#centerLogo .mc-blink{
  transform-origin: center;
  animation: mcBlink 5.5s infinite;
}
@keyframes mcBlink{
  0%,92%,100%{ transform: scaleY(1); }
  94%{ transform: scaleY(0.08); }
  96%{ transform: scaleY(1); }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce){
  #centerLogo .mc-draw,
  #centerLogo .mc-float,
  #centerLogo .mc-monocle,
  #centerLogo .mc-blink{
    animation: none !important;
  }
  #centerLogo .mc-draw{
    stroke-dasharray: none;
    stroke-dashoffset: 0;
  }
}
    </style>
</head>

<body>
    <img src="./monoclers_top_logo.png" alt="logo" class="top-right-image">

    <div class="container">
        <div id="centerLogo" class="center-image" aria-label="logo"></div>
        <!--
        <img src="./monoclers_logo.png" alt="logo" class="center-image">
        -->


        <div class="address">
            SEOUL, REPUBLIC OF KOREA
        </div>

        <div class="email">
            <a href="mailto:hello@monoclers.com">HELLO@MONOCLERS.COM</a>
        </div>

        <div class="copyright">
            COPYRIGHT ⓒ MONOCLERS ALL RIGHTS RESERVED.
        </div>
    </div>
    <script>
  // Build animated monocle-face logo as SVG and mount into #centerLogo only
  (function mountCenterAnimatedLogo(){
    const host = document.getElementById("centerLogo");
    if (!host) return;

    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 256 256");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "monoclers logo");
    svg.setAttribute("class", "mc-float"); // subtle float (logo only)

    const g = document.createElementNS(ns, "g");

    // Face ring (slightly open look)
    const face = document.createElementNS(ns, "circle");
    face.setAttribute("cx", "128");
    face.setAttribute("cy", "128");
    face.setAttribute("r", "108");
    face.setAttribute("class", "mc-stroke mc-draw");
    face.setAttribute("stroke-width", "14");
    face.setAttribute("stroke-dasharray", "640 80");
    face.setAttribute("stroke-dashoffset", "40");
    g.appendChild(face);

    // Left eye (blink)
    const leftEye = document.createElementNS(ns, "circle");
    leftEye.setAttribute("cx", "84");
    leftEye.setAttribute("cy", "118");
    leftEye.setAttribute("r", "16");
    leftEye.setAttribute("class", "mc-fill mc-blink");
    g.appendChild(leftEye);

    // Smile
    const smile = document.createElementNS(ns, "path");
    smile.setAttribute("d", "M 102 170 Q 128 194 154 170");
    smile.setAttribute("class", "mc-stroke mc-draw");
    smile.setAttribute("stroke-width", "14");
    g.appendChild(smile);

    // Monocle group (wobble)
    const mg = document.createElementNS(ns, "g");
    mg.setAttribute("class", "mc-monocle");

    const ring = document.createElementNS(ns, "circle");
    ring.setAttribute("cx", "176");
    ring.setAttribute("cy", "132");
    ring.setAttribute("r", "46");
    ring.setAttribute("class", "mc-stroke mc-draw");
    ring.setAttribute("stroke-width", "14");
    mg.appendChild(ring);

    const rightEye = document.createElementNS(ns, "circle");
    rightEye.setAttribute("cx", "176");
    rightEye.setAttribute("cy", "132");
    rightEye.setAttribute("r", "16");
    rightEye.setAttribute("class", "mc-fill");
    mg.appendChild(rightEye);

    const handle = document.createElementNS(ns, "path");
    handle.setAttribute("d", "M 206 164 L 228 186");
    handle.setAttribute("class", "mc-stroke mc-draw");
    handle.setAttribute("stroke-width", "14");
    mg.appendChild(handle);

    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("cx", "236");
    dot.setAttribute("cy", "194");
    dot.setAttribute("r", "10");
    dot.setAttribute("class", "mc-fill");
    mg.appendChild(dot);

    g.appendChild(mg);
    svg.appendChild(g);

    // Mount (replace only the center logo content)
    host.innerHTML = "";
    host.appendChild(svg);

    // Compute lengths for draw animation (stagger)
    const drawEls = svg.querySelectorAll(".mc-draw");
    drawEls.forEach((el, i) => {
      try {
        const len = el.getTotalLength();
        el.style.setProperty("--len", Math.ceil(len));
        el.style.animationDelay = (0.08 * i) + "s";
      } catch(e) {}
    });
  })();
</script>
</body>

</html>
