<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monoclers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .top-right-image {
            position: absolute;
            top: 30px;
            right: 40px;
            max-width: 120px;
            width: 18vw;
            height: auto;
            z-index: 10;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            mix-blend-mode: screen;
        }

        .top-right-image:hover {
            opacity: 1;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .center-image {
            margin: 20px auto;
            width: 400px;
            max-width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.6s ease;
            mix-blend-mode: screen;
            filter: contrast(500%) brightness(0.7);
        }

        .center-image:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.15));
        }

        h1 {
            font-size: 2.5em;
            font-weight: normal;
            margin-bottom: 40px;
            letter-spacing: 0.05em;
        }

        .separator {
            margin: 20px 0;
            font-size: 1.2em;
        }

        .content {
            line-height: 1.8;
            font-size: 1em;
            margin: 20px 0;
        }

        .address {
            margin-top: 20px;
            font-size: 0.9em;
            letter-spacing: 0.2em;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
        }

        .email {
            font-size: 0.9em;
            letter-spacing: 0.15em;
            font-weight: 500;
        }

        .email a {
            text-decoration: none;
            transition: color 0.3s ease, opacity 0.3s ease;
            opacity: 0.8;
        }

        .email a:hover {
            opacity: 1;
            color: #ffffff;
        }

        .copyright {
            margin-top: 60px;
            font-size: 0.75em;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
        }

        /* 반응형 디자인 */
        @media screen and (max-width: 768px) {
            .top-right-image {
                max-width: 80px;
                width: 20vw;
                top: 10px;
                right: 10px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 30px;
            }

            .separator {
                margin: 15px 0;
                font-size: 1em;
            }

            .center-image {
                margin: 30px auto;
                width: 100%;
                max-width: 400px;
            }

            .content {
                font-size: 0.9em;
            }

            .address,
            .email {
                font-size: 0.9em;
            }

            .copyright {
                margin-top: 40px;
                font-size: 0.8em;
            }
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 15px;
            }

            .top-right-image {
                max-width: 80px;
                width: 25vw;
                top: 10px;
                right: 10px;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 20px;
            }

            .separator {
                margin: 10px 0;
            }

            .center-image {
                margin: 20px auto;
                width: 100%;
                max-width: 500px;
            }

            .content {
                font-size: 0.85em;
            }

            .address,
            .phone {
                font-size: 0.85em;
            }

            .copyright {
                margin-top: 30px;
                font-size: 0.75em;
            }
        }

        a:link {
            color: #fff;
        }

        a:visited {
            color: #fff;
        }
    </style>
</head>

<body>
    <img src="./monoclers_top_logo.png" alt="logo" class="top-right-image">

    <div class="container">
        <img src="./monoclers_logo.png" alt="logo" class="center-image">


        <div class="address">
            SEOUL, REPUBLIC OF KOREA
        </div>

        <div class="email">
            <a href="mailto:hello@monoclers.com">HELLO@MONOCLERS.COM</a>
        </div>

        <div class="copyright">
            COPYRIGHT ⓒ MONOCLERS ALL RIGHTS RESERVED.
        </div>
    </div>
</body>

</html>
